@if (livre) {
  <div class="formulaire">
    <h1>Modifier "{{ livre.titre }}"</h1>

    <div class="champ">
      <label for="titre">Titre du dragon</label>
      <input type="text" id="titre" [(ngModel)]="nouveauTitre" placeholder="Titre du livre">
    </div>

    <div class="champ">
      <label for="auteur">Invocateur du dragon</label>
      <input type="text" id="auteur" [(ngModel)]="nouveauAuteur" placeholder="Auteur du livre">
    </div>

    <div class="champ">
      <label for="isbn">ISBN du dragon</label>
      <input type="text" id="isbn" [(ngModel)]="nouveauIsbn" placeholder="ISBN du livre">
    </div>

    <div class="champ">
      <label for="numero">Place du dragon dans la couvée</label>
      <input type="number" id="numero" [(ngModel)]="nouveauNumero" placeholder="Place dans la série">
    </div>

    <button type="button" class="btn-dragon" (click)="enregistrerModification()">Enregistrer</button>
    <a [routerLink]="['/series', idSerie]" class="lien-retour">Annuler</a>
  </div>
} @else {
  <p>Chargement du dragon...</p>
}
