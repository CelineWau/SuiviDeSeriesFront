@if (profil) {
  <div class="fiche-serie">
    <h1>Mon profil</h1>

    <div class="section-pal infos-globales">
      <h2>Mes informations</h2>

      <div class="ligne-info">
        <span class="label-info">Pseudo : </span>
        <span>{{ profil.pseudo }}</span>
      </div>

      <div class="ligne-info">
        <span class="label-info">Prénom : </span>
        <span>{{ profil.prenom }}</span>
      </div>

      <div class="ligne-info">
        <span class="label-info">Nom : </span>
        <span>{{ profil.nom }}</span>
      </div>

      <div class="ligne-info">
        <span class="label-info">Email : </span>
        @if (!modeEditionEmail) {
          <span>{{ profil.email }}</span>
          <span (click)="ouvrirEditionEmail()" class="btn-edit">✏️</span>
        } @else {
          <input type="email" [(ngModel)]="nouvelEmail"/>
          <button type="button" class="btn-livre" (click)="sauvegarderEmail()">Enregistrer</button>
          <button type="button" class="btn-supprimer" (click)="modeEditionEmail = false; erreurEmail = null">Annuler</button>
        }
      </div>
      @if (erreurEmail) {
        <p class="erreur-serveur">{{ erreurEmail }}</p>
      }
    </div>
  </div>
} @else {
  <p>Chargement du profil...</p>
}
